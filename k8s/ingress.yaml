apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: icanio-devops-ingress
  namespace: icanio
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: icanio-devops-service
                port:
                  number: 80