apiVersion: apps/v1
kind: Deployment
metadata:
  name: icanio-devops-app
  namespace: icanio
spec:
  replicas: 2

  selector:
    matchLabels:
      app: icanio-devops-app

  template:
    metadata:
      labels:
        app: icanio-devops-app

    spec:
      serviceAccountName: icanio-app-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001

      containers:
        - name: icanio-devops-app
          image: imran4786/icanio-devops-app:5

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15