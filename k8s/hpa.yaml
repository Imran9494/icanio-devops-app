apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: icanio-devops-app-hpa
  namespace: icanio

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: icanio-devops-app

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60